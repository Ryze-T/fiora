- id: taint-js-ssti
  languages: [javascript, typescript]
  message: "污点流：用户输入经中转变量流入模板渲染（函数内链路）"
  severity: ERROR
  mode: taint
  pattern-sources:
    - pattern: req.query[...]
    - pattern: req.body[...]
    - pattern: req.params[...]
  pattern-sinks:
    - pattern: ejs.render(...)
    - pattern: ejs.compile(...)
